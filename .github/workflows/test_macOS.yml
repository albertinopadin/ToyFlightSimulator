name: ToyFlightSimulator macOS Tests > main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test macOS App ToyFlightSimulator
    runs-on: macos-26
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Verify Swift version
        run: swift --version

      - name: Run tests
        # `-parallel-testing-enabled NO` makes Swift Testing run one test at a
        # time inside the test host. Without it the suite deadlocks. Tests
        # then run in parallel on Swift's cooperative thread pool (one thread
        # per CPU core). Engine tests block those threads on the ModelLibrary
        # lock and inside MTKTextureLoader's synchronous calls. Once every
        # pool thread is blocked, the kernel gives the loader's dispatch
        # queues no worker thread, so the load never starts and no test
        # wakes. See "Testing" in CLAUDE.md. A serial run still completes the
        # full suite in under 20 s locally.
        #
        # The test bundle also limits itself: its principal class,
        # TestBundleSetup, sets SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH=1
        # when the bundle loads. That variable is an experimental Swift
        # Testing switch and was not checked on this runner's Xcode. This
        # flag is the supported switch, so keep it.
        run: |
          set -o pipefail
          xcodebuild test \
            -project ToyFlightSimulator.xcodeproj \
            -scheme "ToyFlightSimulator macOS" \
            -sdk macosx \
            -configuration Debug \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
